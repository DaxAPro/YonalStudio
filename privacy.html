<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy | Yonal Studio</title>
  <meta name="description" content="Yonal Studio Chrome extension privacy policy.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="touch-layer" id="touchLayer" aria-hidden="true"></div>
  <main class="policy-shell">
    <a class="policy-back icon-button" href="extensions.html" aria-label="Back to extensions" title="Back to extensions">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </a>
    <header class="policy-top">
      <img class="policy-logo logo-tile logo-placeholder" id="policyLogo" src="Yonal.png" alt="Extension logo">
      <div>
        <p class="eyebrow">Privacy Policy</p>
        <h1 id="policyTitle">Privacy Policy</h1>
        <p class="policy-date" id="policyDate">Effective date</p>
      </div>
    </header>
    <section class="policy-meta-card" aria-label="Extension privacy details">
      <dl class="policy-meta" id="policyMeta"></dl>
    </section>
    <article class="policy-card">
      <div class="policy-body" id="policyBody"></div>
    </article>

    <footer class="policy-footer" aria-label="Privacy policy support links">
      <div>
        <strong>Yonal Studio</strong>
        <p>Official privacy information for Chrome extensions from yonalsolutions@gmail.com.</p>
      </div>
      <nav class="policy-footer-actions" aria-label="Support links">
        <a class="button" href="mailto:yonalsolutions@gmail.com">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
          yonalsolutions@gmail.com
        </a>
        <a class="button" id="policyBackFooter" href="extensions.html">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M3 12h18"/><path d="M5 5h14v14H5z"/></svg>
          Back
        </a>
      </nav>
    </footer>
  </main>

  <script src="assets/site.js"></script>
  <script>
    loadExtensions().then((items) => {
      const item = selectedExtension(items);
      const logo = document.getElementById('policyLogo');
      const backUrl = `extensions.html#${encodeURIComponent(cleanId(item.id))}`;
      logo.alt = `${text(item.name, 'Extension')} logo`;
      logo.onerror = () => handleImageError(logo);
      transitionPolicyLogo(logo, logoFor(item));
      document.querySelector('.policy-back').href = backUrl;
      document.getElementById('policyBackFooter').href = backUrl;
      document.title = `${text(item.name, 'Extension')} Privacy Policy | Yonal Studio`;
      document.getElementById('policyTitle').textContent = `${text(item.name, 'Extension')} Privacy Policy`;
      document.getElementById('policyDate').textContent = `Effective date: ${text(item.privacyEffectiveDate, '2026-08-16')}`;
      renderPolicyMeta(document.getElementById('policyMeta'), item);
      renderPolicyDocument(document.getElementById('policyBody'), displayPolicy(item));
    });
  </script>
</body>
</html>
